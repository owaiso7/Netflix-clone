<!DOCTYPE html>
<html lang="en">
<head>

  <title>Netflix Clone</title>
  <link rel="stylesheet" href="netflix.css" />
</head>
<body>
  <header class="navbar">
    <img src="netflix logo.webp" alt="Netflix Logo" class="logo" />
    <nav>
      <a href="#">Home</a>
      <a href="#">TV Shows</a>
      <a href="#">Movies</a>
      <a href="#">My List</a>
    </nav>
  </header>

  <section class="banner">
    <div class="content">
      <h1>Breaking Bad</h1>
      <p>Watch the most dangerous chemistry teacher ever.</p>
      <button>Play</button>
      <button>My List</button>
    </div>
  </section>

  <section class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
      <img src="poster1.jpeg" alt="" class="poster" />
      <img src="poster2.jpeg" alt="" class="poster" />
      <img src="poster3.jpeg" alt="" class="poster" />
      <img src="poster4.jpeg" alt="" class="poster" />
      <!-- add more -->
    </div>
  </section>

</body>
</html>
